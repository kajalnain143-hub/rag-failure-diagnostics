services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      RAG_DB_PATH: /app/data/rag_diagnostics.db
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag_data:
