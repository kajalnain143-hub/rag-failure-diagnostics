services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      RAG_DB_PATH: /app/data/rag_diagnostics.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      API_RATE_WINDOW_SECONDS: ${API_RATE_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag_data:
