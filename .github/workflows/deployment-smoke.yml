name: Live deployment smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run public and authenticated API checks
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
          RENDER_API_AUTH_TOKEN: ${{ secrets.RENDER_API_AUTH_TOKEN }}
        run: |
          if [ -z "$RENDER_API_URL" ]; then
            echo "::error::Add the RENDER_API_URL repository secret first."
            exit 1
          fi
          if [ -z "$RENDER_API_AUTH_TOKEN" ]; then
            echo "::error::Add the RENDER_API_AUTH_TOKEN repository secret first."
            exit 1
          fi
          python scripts/smoke_test.py "$RENDER_API_URL" --token "$RENDER_API_AUTH_TOKEN"
